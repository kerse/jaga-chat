<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JAGA.CHAT — Мобильный прототип</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/channels.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/sheet.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <div class="app-container">

    <!-- ============================== -->
    <!-- Screen 1: Channel List (6.1)   -->
    <!-- ============================== -->
    <div class="view" id="channelsView">

      <!-- Header: space title + icon button -->
      <div class="header">
        <button class="space-title-btn" onclick="openSpaceSheet()">
          <span id="currentSpaceName">JAGA Хаб</span>
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
          </svg>
        </button>
        <button class="space-icon-btn" onclick="openSpaceSheet()" aria-label="Выбрать пространство">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2.5"/>
            <path d="M9 22v-4h6v4"/>
            <path d="M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/>
          </svg>
          <div class="badge-external" id="externalBadge" style="display:none">0</div>
        </button>
      </div>

      <!-- Info pill -->
      <div class="info-banner-wrap">
        <div class="info-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span id="infoPillText">Вы просматриваете каналы пространства «Общее»</span>
        </div>
      </div>

      <!-- Section title -->
      <div class="section-title">Каналы</div>

      <!-- Channel cards (rendered by JS) -->
      <div class="channels-scroll" id="channelsListContainer"></div>

      <!-- Bottom tab bar (Section 6.1: Чаты, Люди, Уведомления, Профиль) -->
      <div class="tabbar">
        <button class="tab-item active">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
          </svg>
          <span>Чаты</span>
        </button>
        <button class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Люди</span>
        </button>
        <button class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span>Уведомления</span>
        </button>
        <button class="tab-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Профиль</span>
        </button>
      </div>

    </div>

    <!-- ============================== -->
    <!-- Screen 2: Chat View (6.3)      -->
    <!-- ============================== -->
    <div class="chat-view hidden-right" id="chatView">

      <!-- Chat header -->
      <div class="chat-header">
        <button class="back-btn" onclick="closeChat()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="chat-header-info">
          <div class="chat-header-title" id="chatHeaderTitle"></div>
          <div class="chat-header-sub" id="chatHeaderSpace"></div>
        </div>
      </div>

      <!-- Messages (rendered by JS) -->
      <div class="messages-area" id="messagesArea"></div>

      <!-- Input bar -->
      <div class="chat-input-bar">
        <input type="text"
               class="chat-input-field"
               id="chatInput"
               placeholder="Сообщение..."
               onkeypress="handleInputKey(event)">
        <button class="send-msg-btn" onclick="sendChatMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- ============================== -->
    <!-- Bottom Sheet (6.2)             -->
    <!-- ============================== -->
    <div class="sheet-overlay" id="sheetOverlay" onclick="closeSpaceSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-handle" onclick="closeSpaceSheet()"></div>
      <div class="sheet-header">
        <div class="sheet-title">Выберите пространство</div>
        <button class="sheet-close-btn" onclick="closeSpaceSheet()">✕</button>
      </div>
      <div class="space-list" id="spaceListContainer"></div>
    </div>

  </div>

  <!-- Scripts (load order matters) -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
